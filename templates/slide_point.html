<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: #0a0a0a;
    font-family: "Noto Sans JP", sans-serif;
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }

  .bg-line {
    position: absolute;
    top: 0; left: 0; width: 8px; height: 100%;
    background: #f5c518;
  }
  .slide-badge {
    position: absolute;
    top: 44px; left: 44px;
    width: 72px; height: 72px;
    background: #f5c518; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 900; color: #0a0a0a; z-index: 4;
  }
  .slide-counter {
    position: absolute;
    top: 50px; right: 44px;
    font-size: 22px; color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.07);
    padding: 7px 18px; border-radius: 20px;
  }

  /* ゴリラ: 大きく・右下 */
  .character-wrap {
    position: absolute;
    right: 0px; bottom: 36px;
    display: flex; flex-direction: column;
    align-items: center; gap: 8px; z-index: 2;
  }
  .character-badge {
    background: #f5c518; color: #0a0a0a;
    font-size: 17px; font-weight: 900;
    padding: 5px 14px; white-space: nowrap;
  }
  .character {
    width: 500px; height: 500px;
    object-fit: contain; object-position: center bottom;
  }

  .progress-bar {
    position: absolute;
    bottom: 22px; left: 20px; right: 20px;
    height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px;
    z-index: 5;
  }
  .progress-fill { height: 100%; background: #f5c518; border-radius: 2px; }
  .swipe {
    position: absolute; bottom: 34px; right: 44px;
    font-size: 18px; color: rgba(255,255,255,0.3);
    z-index: 5;
  }

  /* コンテンツゾーン: 縦全体に space-between で分散 */
  .content-zone {
    position: absolute;
    top: 130px; left: 56px;
    width: 960px;
    height: 1170px;   /* 130px〜1300px = ほぼ全高 */
    display: flex;
    flex-direction: column;
    justify-content: space-between;  /* ← 上下に分散 */
  }

  /* 上段グループ */
  .upper-group {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .point-label {
    display: inline-block;
    background: #f5c518; color: #0a0a0a;
    font-size: 22px; font-weight: 900;
    padding: 6px 20px; letter-spacing: 3px;
    margin-bottom: 16px;
    align-self: flex-start;
  }
  .heading {
    font-size: 72px; font-weight: 900;
    line-height: 1.3; letter-spacing: 2px;
    word-break: keep-all;
    margin-bottom: 18px;
  }
  .heading .yellow { color: #f5c518; }
  .heading-line {
    width: 80px; height: 5px;
    background: #f5c518;
    margin-bottom: 18px;
  }
  .content-box {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-left: 5px solid #f5c518;
    padding: 22px 28px;
    font-size: {{ body_font_size }};
    font-weight: 700;
    line-height: {{ body_line_height }};
    color: #ffffff;
    letter-spacing: 0.5px;
  }
  .content-box .yellow { color: #f5c518; }

  /* ── キーワード強調クラス ── */
  /* 黄色・大きく・太く（最重要ワード） */
  .content-box .key {
    color: #f5c518;
    font-size: 1.25em;
    font-weight: 900;
    letter-spacing: 1px;
  }
  /* 大きく・白・太く（サブ強調） */
  .content-box .big {
    font-size: 1.2em;
    font-weight: 900;
    color: #ffffff;
  }
  /* 黄色のみ（軽い強調） */
  .content-box .em {
    color: #f5c518;
    font-weight: 900;
  }

  /* 下段グループ（ヒント）: 左側のみ・右はゴリラ */
  .lower-group {
    width: 510px;
    padding-bottom: 60px;
    position: relative;
    z-index: 10;
  }
  .hint-label {
    display: flex; align-items: center;
    gap: 8px; margin-bottom: 10px;
  }
  .hint-label-icon {
    width: 34px; height: 34px;
    background: #f5c518; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 900; color: #0a0a0a; flex-shrink: 0;
  }
  .hint-label-text {
    font-size: 18px; font-weight: 700;
    color: #f5c518; letter-spacing: 2px;
  }
  .hint-main {
    font-size: {{ hint_font_size }}; font-weight: 900;
    line-height: 1.3; letter-spacing: 1px;
    color: #f5c518;
    text-shadow: 0 0 40px rgba(245,197,24,0.2);
    word-break: keep-all;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="bg-line"></div>
  <div class="slide-badge">{{ slide_num }}</div>
  <div class="slide-counter">{{ slide_num }}/{{ total }}</div>

  <div class="content-zone">
    <!-- 上段: POINTラベル・見出し・本文 -->
    <div class="upper-group">
      <div class="point-label">POINT {{ slide_num_pad }}</div>
      <div class="heading">{{ heading }}</div>
      <div class="heading-line"></div>
      <div class="content-box">{{ body }}</div>
    </div>
    <!-- 下段: ヒント（左側） -->
    <div class="lower-group">
      <div class="hint-label">
        <div class="hint-label-icon">幸</div>
        <div class="hint-label-text">幸村's POINT</div>
      </div>
      <div class="hint-main">{{ hint }}</div>
    </div>
  </div>

  <!-- ゴリラ（右下・大きく） -->
